    var pref = null; try { pref = localStorage.getItem("zuno-lang"); } catch (e) {}
    if (/^\/fr\//.test(location.pathname) || pref === "fr" || (!pref && /^fr\b/i.test(navigator.language || ""))) {
      document.documentElement.lang = "fr"; document.title = "Page introuvable · Zuno";
      document.getElementById("nf-title").textContent = "Page introuvable";
      var b = document.getElementById("nf-back"); b.textContent = "Retour à Zuno"; b.href = "/fr/";
    }
  })();
